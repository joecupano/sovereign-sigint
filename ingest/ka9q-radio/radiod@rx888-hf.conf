# ============================================================================
# sovereign-sigint : radiod@rx888-hf.conf
#
# ka9q-radio (radiod) configuration for the RX-888 MkII front end.
# Target: Dell Precision T5820 / RTX 5060 Ti / Ubuntu 24.04 server
#
# This file lives at /etc/radio/radiod@rx888-hf.conf once deployed.
# Instance name is "rx888-hf" (everything after the @, before .conf).
# Start with:   sudo systemctl enable --now radiod@rx888-hf
# Status with:  systemctl status radiod@rx888-hf
#
# BEFORE FIRST RUN:
#   1. Generate an FFTW3 wisdom file (can take hours) — see docs/FFTW3.md
#      in the ka9q-radio source tree. Without it, radiod runs but is far
#      less CPU-efficient. On the T5820 this is a one-time cost.
#   2. Confirm avahi-daemon is running — radiod publishes its status/data
#      streams via mDNS (.local hostnames) and other tools resolve them
#      the same way.
#   3. RX-888 MkII must be on native USB3 (blue port), NOT through a hub
#      or a USB3 header routed through a hub chip. At 129.6 MSPS you have
#      no margin for a flaky link.
#
# NOTE: ka9q-radio is Phil Karn's own description an active work in
# progress. Field-verify this file against the radiod@rx888-generic.conf
# template installed alongside your build (usually /etc/radio/) and
# against docs/ka9q-radio.md / ka9q-radio-2.md / ka9q-radio-3.md before
# relying on it — parameter names have shifted between releases.
# ============================================================================

[global]
# Hardware driver selection — RX-888 MkII support is built directly into
# radiod as of mid-2023+ releases (no separate rx888d process needed).
hardware = rx888

# mDNS name radiod publishes its status/control channel under. Other
# programs (control, monitor, ka9q-web, your SIGINT ingest scripts) use
# this hostname to find and command this receiver instance.
status = rx888-hf-status.local

# Default demodulator output mode for any channel that doesn't override it.
mode = usb

# Default output sample rate (Hz) for demodulated PCM channels.
samprate = 12000

# Multicast TTL. ttl = 0 keeps traffic on this host only (loopback/local
# switch, no risk of flooding the LAN). Raise to 1 only if you deliberately
# want other hosts on the segment to subscribe to these streams, and only
# if your switch is IGMP-snooping aware — otherwise you'll flood every
# port with multicast SIGINT traffic.
ttl = 0

# Worker threads for the FFT engine. T5820 has plenty of cores; 4 is a
# reasonable starting point for a single RX-888 front end. Increase if
# radiod's CPU use is a bottleneck rather than a ceiling — check with
# htop while several channels are active.
fft-threads = 4

# Forward-FFT overlap factor. Leave at the default unless you understand
# the fast-convolution filter bank math (see Borgerding's paper referenced
# in the ka9q-radio README) — this affects filter response and CPU load
# together.
overlap = 5

# ----------------------------------------------------------------------
# Front-end hardware section
# ----------------------------------------------------------------------
[rx888]
device = "rx888"
description = "sovereign-sigint RX-888 MkII HF/6m front end"

# Firmware blob loaded onto the RX-888 at attach time.
firmware = SDDC_FX3.img

# Input sample rate. 64.8 MSPS covers 0-30 MHz cleanly (Nyquist with
# margin) and is far less CPU-hungry than the full 129.6 MSPS mode, which
# extends coverage up through 6m via the RX-888 MkII's HF/VHF converter
# path. Start at 64.8 MSPS to prove the system out; raise to 129.6 MSPS
# once you actually need 6m and you've confirmed the T5820 has CPU
# headroom (a mid-range x86 is documented as sufficient, but verify on
# your box before promising 6m coverage in the SIGINT pipeline).
samprate = 64800000
#samprate = 129600000     # uncomment for 0-54 MHz incl. 6m; needs more CPU

# Force the NIC radiod multicasts on — avoids it picking a Wi-Fi or
# management interface by accident. Set to your actual data NIC name.
iface = eth0

# mDNS names for this front end's status and raw IQ multicast streams.
status = rx888-hf-status.local
data = rx888-hf-iq.local
ssrc = 10

# Front-end gain. RX-888 MkII uses a VGA (-10 to +33 dB) rather than the
# original's fixed LNA. Start moderate and adjust against your actual
# antenna/noise floor — too high clips on strong broadcast/AM signals,
# too low buries weak HF traffic under quantization noise. 10-17 dB is
# a commonly reported starting point in HF deployments; log your ADC
# overload counter and tune from there.
gain = 10
gainmode = high

# ============================================================================
# CHANNEL DEFINITIONS
# Each section below is one virtual receiver. radiod demodulates all of
# these simultaneously from the single wideband capture above — that's
# the entire point of ka9q-radio over a conventional single-channel SDR
# app. Add/remove sections freely; there's effectively no per-channel
# hardware cost, only CPU.
#
# "data" per channel gives each one its own mDNS name so downstream
# consumers (direwolf, gnuradio, multimon-ng, your sigint-ingest.py) can
# subscribe to exactly the stream they need without parsing SSRCs.
# ============================================================================

# ---- Propagation / time-standard beacons (WWV/WWVH) -----------------------
# Useful baseline for band-condition awareness feeding the AI layer —
# SNR/Doppler on these known-good carriers is a cheap "is HF even open"
# signal before you go hunting for anything more interesting.
# NOTE: Canada's CHU time station (3330/7850/14670 kHz) SHUT DOWN 22 Jun 2026,
# so its channels were removed. US WWV (2.5/5/10/15/20 MHz) remains on air. If
# you're outside North America, substitute time/standard stations you can
# actually receive (see docs/occupancy-guide.md on picking local references).

[wwv-2.5]
freq = 2500000
mode = am
data = wwv-2500-pcm.local

[wwv-5]
freq = 5000000
mode = am
data = wwv-5000-pcm.local

[wwv-10]
freq = 10000000
mode = am
data = wwv-10000-pcm.local

[wwv-15]
freq = 15000000
mode = am
data = wwv-15000-pcm.local

# ---- Ham bands: voice/CW segments ------------------------------------------
# One representative channel per band is listed; duplicate sections with
# different freq values to cover more of each band (ka9q-radio scales to
# hundreds of simultaneous channels, so be generous once you know what
# you're listening for). Mode choices assume conventional US band plan
# voice/CW segments — adjust to your actual monitoring targets.

[80m-lsb]
freq = 3900000
mode = lsb
data = 80m-lsb-pcm.local

[40m-lsb]
freq = 7200000
mode = lsb
data = 40m-lsb-pcm.local

[40m-cw]
freq = 7030000
mode = cw
data = 40m-cw-pcm.local

[20m-usb]
freq = 14300000
mode = usb
data = 20m-usb-pcm.local

[20m-cw]
freq = 14030000
mode = cw
data = 20m-cw-pcm.local

[17m-usb]
freq = 18130000
mode = usb
data = 17m-usb-pcm.local

[15m-usb]
freq = 21300000
mode = usb
data = 15m-usb-pcm.local

[10m-usb]
freq = 28400000
mode = usb
data = 10m-usb-pcm.local

# ---- Digital mode segments (feed to decode layer, not a human ear) --------
# These are narrowband IQ or wide-enough-USB captures meant for
# multimon-ng / direwolf / WSJT-X style decoders downstream, not for
# listening. Pipe the pcm/iq multicast into your decode/ scripts.

[40m-ft8]
freq = 7074000
mode = usb
data = 40m-ft8-pcm.local

[20m-ft8]
freq = 14074000
mode = usb
data = 20m-ft8-pcm.local

[2m-aprs]
# NOTE: 144.39 MHz APRS is outside RX-888 MkII HF coverage in 64.8 MSPS
# mode and needs the 129.6 MSPS / 2GHz-converter mode, OR — more
# practically — comes off your VHF chain (HackRF/RTL-SDR + OpenWebRX+)
# instead. Left here as a placeholder / reminder to wire APRS decode to
# whichever front end actually carries it in your final topology.
freq = 144390000
mode = fm
data = 2m-aprs-pcm.local

# ---- Wideband raw IQ tap for SIGINT feature extraction ---------------------
# This is the channel your gnuradio flowgraphs / sigint-library.py feature
# extraction (mod classification, duty cycle, occupied bandwidth, phase
# continuity) should subscribe to when you want raw spectrum rather than
# a pre-demodulated audio channel. Keep bandwidth modest until you've
# confirmed downstream CPU/GPU load — this is the channel most likely to
# blow your processing budget if left too wide.

[wideband-iq]
freq = 10000000
mode = iq
samprate = 192000
data = wideband-iq-pcm.local

# ============================================================================
# NEXT STEPS
#   - Validate this file with: radiod -I /etc/radio/radiod@rx888-hf.conf
#     (or your local equivalent invocation) before enabling the service,
#     and watch for FFT/config errors on first run.
#   - Confirm each channel's PCM/IQ stream with:
#       monitor <data-name>.local
#     to verify audio/IQ before wiring decode scripts to it.
#   - Cross-reference gain/samprate choices against your actual antenna
#     and noise floor — the values above are reasonable starting points,
#     not calibrated for your site.
# ============================================================================
